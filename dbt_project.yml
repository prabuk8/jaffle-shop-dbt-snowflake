name: 'dbt_snowflake_analytics'
version: '1.0.0'
config-version: 2

profile: 'default' # Matches the profile name in profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configure models specific settings
models:
  dbt_snowflake_analytics: # Project name
    # Apply to all models in the project
    +materialized: view # Default to views for speed/cost during development
    staging:
        +schema: staging # Build staging models in a 'staging' schema
        +tags: ['staging']
    intermediate:
        +schema: intermediate # Build intermediate models in an 'intermediate' schema
        +tags: ['intermediate']
    marts:
        +materialized: table # Materialize marts as tables
        +schema: analytics # Build marts in an 'analytics' schema
        +tags: ['mart']

# Configure seeds specific settings
seeds:
  dbt_snowflake_analytics: # Project name
    +schema: raw # Load seeds into a 'raw' schema
    +quote_columns: false # Optional: prevent quoting column names